<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员后台 - 神秘商店</title>
  <link rel="stylesheet" href="style.css?v=20260930p">
</head>
<body>
  <div class="admin-container">
    <h1>🎛️ 神秘商店管理后台</h1>

    <!-- 登录界面 -->
    <div id="loginScreen" class="login-screen">
      <div class="login-box">
        <div class="login-icon">🔐</div>
        <h2>管理员登录</h2>
        <p style="font-size:0.85em;color:rgba(255,255,255,0.6);margin-bottom:16px;">请输入管理员密码以访问后台</p>
        <input type="password" id="adminPassword" placeholder="请输入密码" autocomplete="off">
        <button class="btn-save" id="btnLogin" style="margin-top:12px;">登录</button>
        <p id="loginError" class="login-error"></p>
      </div>
    </div>

    <div class="loading" id="loading" style="display:none;">加载中</div>

    <div id="adminContent" style="display:none;">
      <!-- 标题与副标题 -->
      <div class="admin-section">
        <h2>📝 页面设置</h2>
        <div class="form-group">
          <label>页面标题</label>
          <input type="text" id="titleInput" placeholder="神秘商店">
        </div>
        <div class="form-group">
          <label>副标题文本</label>
          <textarea id="subtitleInput" placeholder="欢迎来到神秘商店"></textarea>
        </div>
      </div>

      <!-- 奖池管理 -->
      <div class="admin-section">
        <h2>🎁 奖池管理</h2>
        <div id="prizeList"></div>
        <button class="btn-small btn-add" id="btnAddPrize">+ 添加奖品</button>

        <div class="probability-slope-row">
          <label for="slopeInput">中心品质</label>
          <input type="number" id="slopeInput" step="1" min="1" max="10" placeholder="3">
          <span class="slope-hint">输入1~10，该品质概率最高，两侧按正态分布递减</span>
        </div>
      </div>

      <!-- 刷新口令管理 -->
      <div class="admin-section">
        <h2>🔐 刷新口令管理</h2>
        <p style="font-size:0.8em;color:rgba(255,255,255,0.6);margin-bottom:8px;">
          可添加多个口令，每个口令单独设置可用次数。刷新次数越多，高级奖品概率越高。
        </p>
        <div id="codeList"></div>
        <button class="btn-small btn-add" id="btnAddCode">+ 添加口令</button>
      </div>

      <!-- 重置奖池 -->
      <div class="admin-section">
        <h2>🔄 重置操作</h2>
        <div class="reset-buttons">
          <button class="btn-reset" id="btnResetPool">重置奖池</button>
        </div>
        <p style="font-size:0.78em;color:rgba(255,255,255,0.5);margin-top:8px;line-height:1.5;">
          重置奖池：九宫格恢复未开启状态。
        </p>
      </div>

      <!-- 保存按钮 -->
      <button class="btn-save" id="btnSave">💾 保存所有设置</button>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;">
      <a href="index.html" class="back-link" style="margin:0;">← 返回抽奖页面</a>
      <button class="btn-small" id="btnLogout" style="background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);">退出登录</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="admin.js?v=20260930p"></script>
</body>
</html>
