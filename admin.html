<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员后台 - 神秘商店</title>
  <link rel="stylesheet" href="style.css?v=20260929e">
</head>
<body>
  <div class="admin-container">
    <h1>🎛️ 神秘商店管理后台</h1>

    <div class="loading" id="loading">加载中</div>

    <div id="adminContent" style="display:none;">
      <!-- 标题与副标题 -->
      <div class="admin-section">
        <h2>📝 页面设置</h2>
        <div class="form-group">
          <label>页面标题</label>
          <input type="text" id="titleInput" placeholder="神秘商店">
        </div>
        <div class="form-group">
          <label>副标题文本</label>
          <textarea id="subtitleInput" placeholder="欢迎来到神秘商店"></textarea>
        </div>
      </div>

      <!-- 奖池管理 -->
      <div class="admin-section">
        <h2>🎁 奖池管理</h2>
        <div id="prizeList"></div>
        <button class="btn-small btn-add" id="btnAddPrize">+ 添加奖品</button>
      </div>

      <!-- 刷新口令管理 -->
      <div class="admin-section">
        <h2>🔐 刷新口令管理</h2>
        <p style="font-size:0.8em;color:rgba(255,255,255,0.6);margin-bottom:8px;">
          可添加多个口令，每个口令单独设置可用次数。刷新次数越多，高级奖品概率越高。
        </p>
        <div id="codeList"></div>
        <button class="btn-small btn-add" id="btnAddCode">+ 添加口令</button>

        <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.1);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:0.85em;color:rgba(255,255,255,0.8);">累计刷新次数（影响概率）</span>
            <span class="count-display" id="countDisplay" style="margin:0;font-size:1.3em;">0</span>
          </div>
          <div class="admin-actions">
            <button class="btn-small btn-count" id="btnAddCount">+1</button>
            <button class="btn-small btn-count" id="btnAddCount5">+5</button>
            <button class="btn-small btn-count" id="btnResetCount">清零</button>
          </div>
        </div>
      </div>

      <!-- 重置奖池 -->
      <div class="admin-section">
        <h2>🔄 重置奖池</h2>
        <p style="font-size:0.85em;color:rgba(255,255,255,0.7);margin-bottom:10px;">
          重置后九宫格恢复未开启状态，累计刷新次数清零，所有口令次数恢复为设定值。
        </p>
        <button class="btn-reset" id="btnResetPool">重置奖池到未开启状态</button>
      </div>

      <!-- 保存按钮 -->
      <button class="btn-save" id="btnSave">💾 保存所有设置</button>
    </div>

    <a href="index.html" class="back-link">← 返回抽奖页面</a>
  </div>

  <div class="toast" id="toast"></div>
  <script src="admin.js?v=20260929e"></script>
</body>
</html>
